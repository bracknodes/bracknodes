<svg xmlns="http://www.w3.org/2000/svg" width="370" height="36" viewBox="0 0 370 36" fill="none">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-15%" width="110%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .label-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      fill: #F8FAFC;
      letter-spacing: 0.2px;
      dominant-baseline: middle;
    }
    .url-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 800;
      fill: #FFFFFF;
      letter-spacing: 0.3px;
      dominant-baseline: middle;
    }
    .badge-frame {
      transition: all 0.2s ease;
    }
    .badge-frame:hover {
      filter: brightness(1.1);
    }
  </style>

  <g class="badge-frame" filter="url(#shadow)">
    <!-- Base pill container -->
    <rect x="1" y="1" width="368" height="34" rx="8" fill="url(#bgGrad)" stroke="#334155" stroke-width="1" />

    <!-- Left side: Icon + Label -->
    <!-- Globe / Web Icon -->
    <g transform="translate(14, 9)">
      <circle cx="9" cy="9" r="8" fill="none" stroke="#F59E0B" stroke-width="1.6" />
      <path d="M1 9h16M9 1a13 13 0 0 1 0 16 13 13 0 0 1 0-16z" fill="none" stroke="#F59E0B" stroke-width="1.3" />
    </g>
    <text x="38" y="18" class="label-text">Compare All Cheap Plans</text>

    <!-- Right side: Colored Pill -->
    <rect x="202" y="1" width="167" height="34" rx="8" fill="url(#amberGrad)" />
    <!-- Straight left edge for right badge to join left cleanly with 8px right rounding -->
    <path d="M202 1 h6 v34 h-6 z" fill="url(#amberGrad)" />

    <!-- Right Side Text with Arrow -->
    <text x="214" y="18" class="url-text">bracknodes.in/webhost</text>
    <path d="M352 14 l4 4 -4 4" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
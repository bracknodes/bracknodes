<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Luminous Tech Light Gradients -->
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <radialGradient id="warmSunGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#FDE68A" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="amberCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Clean crisp drop shadow (NO blurry muddy glow) -->
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.4)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.8)); }
    }
    @keyframes dashHex {
      0% { stroke-dashoffset: 48; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes orbitSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50% { transform: translateY(-8px); opacity: 0.9; }
    }

    .pulse-core {
      animation: pulseNode 3s ease-in-out infinite;
      transform-origin: 600px 135px;
    }
    .orbit-ring {
      animation: orbitSpin 24s linear infinite;
      transform-origin: 600px 135px;
    }
    .dash-line {
      stroke-dasharray: 8 8;
      animation: dashHex 2s linear infinite;
    }
    .p-float-1 { animation: floatParticle 4s ease-in-out infinite; }
    .p-float-2 { animation: floatParticle 6s ease-in-out infinite 1.5s; }
  </style>

  <!-- Card Background (Luminous Light & Modern) -->
  <rect width="1200" height="420" rx="20" fill="url(#lightBg)" stroke="#CBD5E1" stroke-width="1.5" filter="url(#crispShadow)" />
  <rect width="1200" height="420" rx="20" fill="url(#warmSunGlow)" />

  <!-- Clean Precision Dot / Line Grid -->
  <g opacity="0.12" stroke="#64748B" stroke-width="0.75">
    <line x1="0" y1="84" x2="1200" y2="84" />
    <line x1="0" y1="168" x2="1200" y2="168" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="336" x2="1200" y2="336" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Light Orbits -->
  <g class="orbit-ring">
    <circle cx="600" cy="135" r="120" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 14" opacity="0.4" />
    <circle cx="600" cy="15" r="4" fill="#F59E0B" />
    <circle cx="704" cy="195" r="3.5" fill="#10B981" />
    <circle cx="496" cy="195" r="3.5" fill="#6366F1" />
  </g>

  <!-- Floating Tech Sparks -->
  <circle cx="220" cy="90" r="3" fill="#F59E0B" class="p-float-1" />
  <circle cx="980" cy="110" r="3.5" fill="#F59E0B" class="p-float-2" />
  <circle cx="340" cy="270" r="2.5" fill="#10B981" class="p-float-2" />
  <circle cx="860" cy="280" r="3" fill="#6366F1" class="p-float-1" />

  <!-- ==================== BRACKNODES OFFICIAL LOGO EMBLEM ==================== -->
  <!-- Outer Hexagon Base Badge -->
  <polygon points="600,45 680,90 680,180 600,225 520,180 520,90" 
           fill="#FFFFFF" stroke="#0F172A" stroke-width="6" stroke-linejoin="round"
           filter="url(#badgeShadow)" />

  <!-- Animated Inner Amber Hexagon Trace -->
  <polygon points="600,52 673,93 673,177 600,218 527,177 527,93" 
           fill="none" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round"
           class="dash-line" opacity="0.85" />

  <!-- 3 Connection Rods (Slate Grey-Blue) -->
  <!-- Rod 1: Center to Top Node -->
  <line x1="600" y1="135" x2="600" y2="82" stroke="#64748B" stroke-width="6" stroke-linecap="round" />
  <!-- Rod 2: Center to Bottom-Left Node (210°) -->
  <line x1="600" y1="135" x2="554" y2="162" stroke="#64748B" stroke-width="6" stroke-linecap="round" />
  <!-- Rod 3: Center to Bottom-Right Node (330°) -->
  <line x1="600" y1="135" x2="646" y2="162" stroke="#64748B" stroke-width="6" stroke-linecap="round" />

  <!-- 3 Outer Satellite Nodes (Solid Obsidian Black) -->
  <circle cx="600" cy="82" r="14" fill="#0F172A" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="554" cy="162" r="14" fill="#0F172A" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="646" cy="162" r="14" fill="#0F172A" stroke="#FFFFFF" stroke-width="2" />

  <!-- Center Golden-Orange Core Node (With Smooth Pulse) -->
  <g class="pulse-core">
    <circle cx="600" cy="135" r="27" fill="url(#amberCore)" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="600" cy="135" r="11" fill="#FEF3C7" opacity="0.4" />
  </g>

  <!-- ==================== SHARP, HIGH-CONTRAST TYPOGRAPHY ==================== -->
  <!-- Main Title: Crisp, Ultra-Sharp Obsidian & Gold (ZERO BLUR!) -->
  <text x="600" y="286" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
        font-size="46" font-weight="900" letter-spacing="5" fill="url(#titleGrad)">
    BRACKNODES
  </text>

  <!-- Tagline: Clean, readable slate -->
  <text x="600" y="322" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
        font-size="14.5" font-weight="700" letter-spacing="2" fill="#475569">
    FAST NVME CLOUD • WEB HOSTING • KVM VPS • 24/7 DISCORD BOT HOSTING
  </text>

  <!-- ==================== BOTTOM FEATURE PILLS (CRISP & LEGIBLE) ==================== -->
  <g transform="translate(145, 355)">
    <!-- Pill 1: Starting Price -->
    <g transform="translate(0, 0)">
      <rect width="165" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#badgeShadow)" />
      <circle cx="20" cy="17" r="4.5" fill="#10B981" />
      <text x="32" y="22" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#0F172A">From ₹29 / month</text>
    </g>

    <!-- Pill 2: Pure NVMe -->
    <g transform="translate(180, 0)">
      <rect width="155" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#badgeShadow)" />
      <text x="16" y="22" font-family="-apple-system, sans-serif" font-size="14" fill="#F59E0B">⚡</text>
      <text x="36" y="22" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#0F172A">Pure NVMe SSD</text>
    </g>

    <!-- Pill 3: 99.99% SLA -->
    <g transform="translate(350, 0)">
      <rect width="145" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#badgeShadow)" />
      <circle cx="18" cy="17" r="4.5" fill="#10B981" />
      <text x="30" y="22" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#059669">99.99% SLA</text>
    </g>

    <!-- Pill 4: Human Support -->
    <g transform="translate(510, 0)">
      <rect width="185" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#badgeShadow)" />
      <text x="16" y="22" font-family="-apple-system, sans-serif" font-size="13" fill="#6366F1">💬</text>
      <text x="36" y="22" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#0F172A">24/7 Human Support</text>
    </g>

    <!-- Pill 5: DDoS Protection -->
    <g transform="translate(710, 0)">
      <rect width="195" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#badgeShadow)" />
      <text x="16" y="22" font-family="-apple-system, sans-serif" font-size="13" fill="#0284C7">🛡️</text>
      <text x="36" y="22" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#0F172A">DDoS Protection</text>
    </g>
  </g>
</svg>
